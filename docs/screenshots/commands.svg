<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220">
  <rect width="640" height="220" rx="12" fill="#0d1117"/>
  <rect x="20" y="20" width="600" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <!-- title -->
  <text x="40" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#58a6ff">pi-translate commands</text>
  <!-- command rows -->
  <rect x="40" y="74" width="560" height="28" rx="6" fill="#21262d"/>
  <text x="52" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#ff7b72">/translate</text>
  <text x="200" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9">toggle translation on/off</text>

  <rect x="40" y="110" width="560" height="28" rx="6" fill="#21262d"/>
  <text x="52" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#ff7b72">/translate-backend google</text>
  <text x="320" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9">switch backend</text>

  <rect x="40" y="146" width="560" height="28" rx="6" fill="#21262d"/>
  <text x="52" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#ff7b72">/translate-original</text>
  <text x="260" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9">open original English panel</text>

  <rect x="40" y="182" width="560" height="28" rx="6" fill="#21262d"/>
  <text x="52" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#ff7b72">Ctrl+Shift+E</text>
  <text x="220" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9">same as /translate-original</text>
</svg>
